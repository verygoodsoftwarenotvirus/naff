project:
  name: "TestProject"
  module: "github.com/example/testproject"
  ios_bundle_id: "com.example.testproject"
  ios_module_name: "TestProject"

targets:
  backend: true
  ios: true
  # Opt out — integration_project.yaml is the generic fresh-project fixture, and
  # cmd/functions/async_message_handler imports a hand-rolled
  # internal/build/functions/data_change_message_handler package that naff
  # doesn't emit. Without this opt-out, `go build ./...` inside output/ would fail.
  async_message_handler: false

features:
  webhooks: true
  issuereports: true
  comments: true
  notifications: true
  payments: false
  waitlists: false
  uploadedmedia: true
  dataprivacy: true
  consumer_app: true
  admin_app: true

domains:
  - name: "recipes"
    entities:
      - name: "Recipe"
        belongs_to_account: true
        created_by_user: true
        searchable: true
        consumer_editable: true
        fields:
          - name: "Name"
            type: "string"
          - name: "Description"
            type: "string"
          - name: "InspiredByRecipeID"
            type: "*string"
            editable: false
            required: false
          - name: "MinEstimatedPortions"
            type: "float32"
          - name: "MaxEstimatedPortions"
            type: "*float32"
          - name: "SealOfApproval"
            type: "bool"
            creatable: false

      - name: "RecipeStep"
        belongs_to: "Recipe"
        belongs_to_account: true
        created_by_user: true
        fields:
          - name: "Index"
            type: "uint32"
          - name: "PreparationID"
            type: "string"
          - name: "Notes"
            type: "string"
            required: false
