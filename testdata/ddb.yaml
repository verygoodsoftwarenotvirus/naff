project:
  name: "DinnerDoneBetter"
  module: "github.com/dinnerdonebetter/dinnerdonebetter/backend"

# Targets block omitted — backend and async_message_handler default to on;
# iOS defaults off. DDB wants exactly that.

features:
  webhooks: true
  issuereports: true
  comments: true
  notifications: true
  payments: true
  waitlists: true
  uploadedmedia: true
  dataprivacy: true

domains:
  - name: "mealplanning"
    type_name: "MealPlanning"
    entities:
      - name: "Recipe"
        created_by_user: true
        searchable: true
        fields:
          - name: "Name"
            type: "string"
          - name: "Slug"
            type: "string"
          - name: "Source"
            type: "string"
          - name: "SourceISBN"
            type: "string"
          - name: "Description"
            type: "string"
          - name: "PluralPortionName"
            type: "string"
          - name: "PortionName"
            type: "string"
          - name: "YieldsComponentType"
            type: "string"
          - name: "Status"
            type: "string"
          - name: "SealOfApproval"
            type: "bool"
            creatable: false
          - name: "EligibleForMeals"
            type: "bool"
          - name: "InspiredByRecipeID"
            type: "*string"
            required: false

      - name: "RecipeStep"
        belongs_to: "Recipe"
        fields:
          - name: "Notes"
            type: "string"
            required: false
          - name: "ExplicitInstructions"
            type: "string"
            required: false
          - name: "ConditionExpression"
            type: "string"
            required: false
          - name: "Index"
            type: "uint32"
          - name: "Optional"
            type: "bool"
          - name: "StartTimerAutomatically"
            type: "bool"

      - name: "RecipeStepIngredient"
        belongs_to: "RecipeStep"
        fields:
          - name: "Name"
            type: "string"
          - name: "QuantityNotes"
            type: "string"
            required: false
          - name: "IngredientNotes"
            type: "string"
            required: false
          - name: "Index"
            type: "uint16"
          - name: "OptionIndex"
            type: "uint16"
          - name: "Optional"
            type: "bool"
          - name: "ToTaste"
            type: "bool"
          - name: "ScaleFactor"
            type: "float32"
          - name: "VesselIndex"
            type: "*uint16"
            required: false
          - name: "ProductPercentageToUse"
            type: "*float32"
            required: false
          - name: "RecipeStepProductID"
            type: "*string"
            required: false
            editable: false

      - name: "RecipeStepInstrument"
        belongs_to: "RecipeStep"
        fields:
          - name: "Name"
            type: "string"
          - name: "Notes"
            type: "string"
            required: false
          - name: "Index"
            type: "uint16"
          - name: "OptionIndex"
            type: "uint16"
          - name: "PreferenceRank"
            type: "uint8"
          - name: "Optional"
            type: "bool"
          - name: "ScaleFactor"
            type: "float32"
          - name: "RecipeStepProductID"
            type: "*string"
            required: false
            editable: false

      - name: "RecipeStepVessel"
        belongs_to: "RecipeStep"
        fields:
          - name: "Name"
            type: "string"
          - name: "Notes"
            type: "string"
            required: false
          - name: "VesselPreposition"
            type: "string"
            required: false
          - name: "Index"
            type: "uint16"
          - name: "OptionIndex"
            type: "uint16"
          - name: "UnavailableAfterStep"
            type: "bool"
          - name: "ScaleFactor"
            type: "float32"
          - name: "RecipeStepProductID"
            type: "*string"
            required: false
            editable: false

      - name: "RecipeStepProduct"
        belongs_to: "RecipeStep"
        fields:
          - name: "Name"
            type: "string"
          - name: "Type"
            type: "string"
          - name: "StorageInstructions"
            type: "string"
            required: false
          - name: "QuantityNotes"
            type: "string"
            required: false
          - name: "Index"
            type: "uint16"
          - name: "IsWaste"
            type: "bool"
          - name: "IsLiquid"
            type: "bool"
          - name: "Compostable"
            type: "bool"
          - name: "ContainedInVesselIndex"
            type: "*uint16"
            required: false

      - name: "RecipeStepCompletionCondition"
        belongs_to: "RecipeStep"
        fields:
          - name: "Notes"
            type: "string"
            required: false
          - name: "Optional"
            type: "bool"

      - name: "RecipeMedia"
        fields:
          - name: "MimeType"
            type: "string"
          - name: "InternalPath"
            type: "string"
          - name: "ExternalPath"
            type: "string"
          - name: "Index"
            type: "uint16"
          - name: "BelongsToRecipe"
            type: "*string"
            required: false
          - name: "BelongsToRecipeStep"
            type: "*string"
            required: false

      - name: "RecipeRating"
        fields:
          - name: "RecipeID"
            type: "string"
            editable: false
          - name: "Notes"
            type: "string"
            required: false
          - name: "Taste"
            type: "float32"
          - name: "Instructions"
            type: "float32"
          - name: "Overall"
            type: "float32"
          - name: "Cleanup"
            type: "float32"
          - name: "Difficulty"
            type: "float32"

      - name: "RecipePrepTask"
        belongs_to: "Recipe"
        fields:
          - name: "Name"
            type: "string"
          - name: "Description"
            type: "string"
          - name: "StorageType"
            type: "string"
          - name: "ExplicitStorageInstructions"
            type: "string"
            required: false
          - name: "Notes"
            type: "string"
            required: false
          - name: "Optional"
            type: "bool"

      - name: "RecipeList"
        created_by_user: true
        fields:
          - name: "Name"
            type: "string"
          - name: "Description"
            type: "string"

      - name: "RecipeListItem"
        belongs_to: "RecipeList"
        fields:
          - name: "Notes"
            type: "string"
            required: false

      - name: "Meal"
        created_by_user: true
        fields:
          - name: "Name"
            type: "string"
          - name: "Description"
            type: "string"
          - name: "EligibleForMealPlans"
            type: "bool"

      - name: "MealPlan"
        belongs_to_account: true
        created_by_user: true
        fields:
          - name: "Status"
            type: "string"
            creatable: false
          - name: "Notes"
            type: "string"
            required: false
          - name: "ElectionMethod"
            type: "string"
          - name: "GroceryListInitialized"
            type: "bool"
            creatable: false
            editable: false
          - name: "TasksCreated"
            type: "bool"
            creatable: false
            editable: false

      - name: "MealPlanEvent"
        belongs_to: "MealPlan"
        fields:
          - name: "MealName"
            type: "string"
          - name: "Notes"
            type: "string"
            required: false

      - name: "MealPlanOption"
        belongs_to: "MealPlanEvent"
        fields:
          - name: "Notes"
            type: "string"
            required: false
          - name: "MealScale"
            type: "float32"
          - name: "Chosen"
            type: "bool"
            creatable: false
            editable: false
          - name: "TieBroken"
            type: "bool"
            creatable: false
            editable: false
          - name: "AssignedCook"
            type: "*string"
            required: false
          - name: "AssignedDishwasher"
            type: "*string"
            required: false

      - name: "MealPlanOptionVote"
        belongs_to: "MealPlanOption"
        fields:
          - name: "Notes"
            type: "string"
            required: false
          - name: "Rank"
            type: "uint8"
          - name: "Abstain"
            type: "bool"

      - name: "MealPlanGroceryListItem"
        belongs_to: "MealPlan"
        fields:
          - name: "Status"
            type: "string"
          - name: "StatusExplanation"
            type: "string"
            required: false
          - name: "PurchasePrice"
            type: "*float32"
            required: false
          - name: "QuantityPurchased"
            type: "*float32"
            required: false
          - name: "PurchasedUPC"
            type: "*string"
            required: false

      - name: "MealPlanTask"
        fields:
          - name: "Status"
            type: "string"
          - name: "CreationExplanation"
            type: "string"
            required: false
          - name: "StatusExplanation"
            type: "string"
            required: false
          - name: "AssignedToUser"
            type: "*string"
            required: false

      - name: "MealList"
        created_by_user: true
        fields:
          - name: "Name"
            type: "string"
          - name: "Description"
            type: "string"

      - name: "MealListItem"
        belongs_to: "MealList"
        fields:
          - name: "Notes"
            type: "string"
            required: false

      - name: "MealPlanRecipeOptionSelection"
        belongs_to: "MealPlanOption"
        fields:
          - name: "RecipeID"
            type: "string"
            editable: false
          - name: "RecipeStepID"
            type: "string"
            editable: false
          - name: "SelectionType"
            type: "string"
            editable: false
          - name: "IngredientIndex"
            type: "uint16"
            editable: false
          - name: "SelectedOptionIndex"
            type: "uint16"

      - name: "AccountInstrumentOwnership"
        belongs_to_account: true
        fields:
          - name: "Notes"
            type: "string"
            required: false
          - name: "Quantity"
            type: "uint16"

      - name: "UserIngredientPreference"
        created_by_user: true
        fields:
          - name: "Notes"
            type: "string"
            required: false
          - name: "Rating"
            type: "int8"
          - name: "Allergy"
            type: "bool"
